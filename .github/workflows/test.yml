name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
        jenkins-image: ['jenkins/jenkins:2.516.2-jdk17', 'jenkins/jenkins:lts-jdk17']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Setup GCP test keys
      env:
        GCP_SA1_KEY: ${{ secrets.GCP_SA1_KEY }}
        GCP_SA2_KEY: ${{ secrets.GCP_SA2_KEY }}
      run: |
        mkdir -p tests/fixtures/gcp-keys
        if [[ -n "${GCP_SA1_KEY}" && -n "${GCP_SA2_KEY}" ]]; then
          printf '%s' "${GCP_SA1_KEY}" > tests/fixtures/gcp-keys/jenkee-tester-viewer-sa-1.json
          printf '%s' "${GCP_SA2_KEY}" > tests/fixtures/gcp-keys/jenkee-tester-viewer-sa-2.json
          echo "✓ GCP test keys configured"
        else
          echo "::warning::GCP_SA1_KEY or GCP_SA2_KEY secrets not configured. GCP tests will be skipped."
          echo "::warning::See docs/GITHUB_SECRETS_SETUP.md for setup instructions."
        fi

    - name: Run tests with pytest
      env:
        JENKINS_IMAGE: ${{ matrix.jenkins-image }}
      run: |
        pytest -v -s --tb=short --log-cli-level=INFO --cov=jenkins_tools --cov-report=term

    - name: Test Summary
      run: |
        echo "✅ All tests passed for Python ${{ matrix.python-version }}"
